[package]
name = "fusee-bench"
description = "Fusee's open benchmark harness: floors, workloads, open- and closed-loop load"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "fusee-bench"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fusee.workspace = true
fusee-server.workspace = true
hdrhistogram.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros", "net", "io-util", "sync"] }
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"
