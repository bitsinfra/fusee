\* Leases with clocks running at one or two units per tick: a lease of
\* Promise * MinRate / MaxRate is safe. Check with MCLease.tla.
CONSTANTS
    r1 = r1
    r2 = r2
    r3 = r3
    Replicas = {r1, r2, r3}
    Order <- RoundRobin
    MaxView = 1
    MaxWrites = 1
    MaxTime = 3
    MaxCrashes = 1
    Promise = 2
    MinRate = 1
    MaxRate = 2
    Lease = 1
    PromiseRule = TRUE
SPECIFICATION Spec
INVARIANTS
    LeaseReadsAreCurrent
    LeaseExcludesNewerViews
