[package]
name = "fusee-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fusee-core = { path = "../crates/fusee-core" }

[workspace]

[[bin]]
name = "record"
path = "fuzz_targets/record.rs"
test = false
doc = false

[[bin]]
name = "segment"
path = "fuzz_targets/segment.rs"
test = false
doc = false

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false

[[bin]]
name = "store"
path = "fuzz_targets/store.rs"
test = false
doc = false

[[bin]]
name = "journal"
path = "fuzz_targets/journal.rs"
test = false
doc = false
