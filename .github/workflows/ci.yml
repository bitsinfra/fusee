name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release
      - name: Test kit (fusee::testing)
        run: |
          cargo clippy -p fusee --features testing --all-targets -- -D warnings
          cargo test --release -p fusee --features testing --test testing --lib
      - name: Simulation seeds (fixed CI set)
        run: cargo run --release -p fusee-sim --bin fusee-sim -- --seeds 0..20000
      - name: Replication seeds
        run: cargo test --release -p fusee-core vsr
        env:
          FUSEE_VSR_SEEDS: "500"
      - name: SIGKILL loop
        run: cargo run --release -p fusee-sim --bin fusee-crashtest -- driver "$RUNNER_TEMP/fusee-crash" 20 100
      - name: Replicated SIGKILL loop (kill the primary process)
        run: cargo run --release -p fusee-sim --bin fusee-crashtest -- replicated-driver "$RUNNER_TEMP/fusee-repl" 10 200
      - name: Linux I/O paths (O_DIRECT, RWF_DSYNC, io_uring)
        if: runner.os == 'Linux'
        run: cargo test --release -p fusee --features io-uring --test engine
  bindings:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: cargo build --release --locked -p fusee-node -p fusee-python -p fusee-c --lib
      - run: cargo build --release --locked -p fusee --example conformance
      - run: cargo build --release --locked -p fusee-cli
      - name: TypeScript SDK
        working-directory: bindings/node
        run: |
          npm ci || npm install
          node scripts/copy-native.mjs
          npx tsc -p tsconfig.json
          node --test test/*.test.mjs
          bun test test/*.test.mjs
      - name: The API spec (each SDK against api/spec.json; docs/api.md generated from it)
        run: |
          cp target/release/lib_native.so bindings/python/python/fusee/_native.abi3.so
          python api/check.py
          python api/gen.py --check
      - name: The docs' code blocks and the tutorials' projects
        run: |
          python scripts/check_docs.py --fusee target/release/fusee
          scripts/check_tutorials.sh target/release/fusee
      - name: The tutorials followed end to end (dev, kill -9, resume, signal, test)
        run: python scripts/check_tutorial_flow.py --fusee target/release/fusee
      - name: The docs site builds and its links resolve
        run: |
          npm ci --prefix docs
          python -m pip install -r docs/tooling/requirements.txt
          python scripts/build-docs.py
          python scripts/check_site_links.py target/site
      - name: Python SDK
        run: |
          cp target/release/lib_native.so bindings/python/python/fusee/_native.abi3.so
          for t in bindings/python/tests/test_*.py; do
            FUSEE_CLI=target/release/fusee PYTHONPATH=bindings/python/python python "$t"
          done
      - name: API reports (the public surface, reviewed in each change)
        run: python api/reports.py --check
      - name: Go SDK (static libfusee_c from target/release; server tests use target/release/fusee)
        working-directory: bindings/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
      - name: Java SDK (JNI layer linked with target/release/libfusee_c.a; server tests use target/release/fusee)
        working-directory: bindings/java
        run: mvn -B -q test
      - name: The five example applications in five languages
        run: |
          cargo build --release --locked -p fusee --example payment_saga --example agent_loop \
            --example scheduled_job --example human_approval --example cart_object
          (cd bindings/java && mvn -B -q compile)
          scripts/check_examples.sh
      - name: Cross-SDK conformance
        run: |
          ./target/release/examples/conformance > rust.json
          node bindings/node/conformance.mjs > ts.json
          PYTHONPATH=bindings/python/python python bindings/python/conformance.py > py.json
          (cd bindings/go && go run ./cmd/conformance) > go.json
          (cd bindings/java && java -cp target/classes:target/test-classes dev.fusee.cmd.Conformance) > java.json
          python conformance/compare.py rust.json ts.json py.json go.json java.json
          python conformance/remote.py
          python conformance/replica.py
          PYTHONPATH=bindings/python/python python conformance/dedicated.py
  ui:
    # The web UI: types, the theme's contrast test, and the checked-in build
    # under crates/fusee/src/http/ui-dist equal to what the source builds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - working-directory: ui
        run: |
          npm ci
          npm run check
          node build.mjs
      - run: git diff --exit-code crates/fusee/src/http/ui-dist
  java:
    # The Java SDK's native library on each platform (Java 17 takes the
    # platform-thread path), uploaded for a multi-platform jar.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, java: "17", platform: linux-x86_64 }
          - { os: ubuntu-24.04-arm, java: "21", platform: linux-aarch64 }
          - { os: macos-15, java: "21", platform: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: cargo build --release --locked -p fusee-c --lib
      - run: cargo build --release --locked -p fusee-cli
      - name: mvn test
        working-directory: bindings/java
        run: mvn -B -q test
      - uses: actions/upload-artifact@v4
        with:
          name: fusee-jni-${{ matrix.platform }}
          path: bindings/java/target/classes/dev/fusee/native/${{ matrix.platform }}
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for 60 s
        working-directory: fuzz
        run: for t in record segment frame store journal; do cargo fuzz run $t -- -max_total_time=60; done
