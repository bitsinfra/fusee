[package]
name = "fusee-sim"
description = "Deterministic simulation testing for Fusee: seeded scheduler, faulty disks and networks, and correctness checkers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "fusee-sim"
path = "src/main.rs"

[[bin]]
name = "fusee-crashtest"
path = "src/bin/crashtest.rs"

[dependencies]
fusee.workspace = true
fusee-core.workspace = true
fusee-server.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros"] }

[lints]
workspace = true
