[package]
name = "fusee-cli"
description = "The fusee command: disk-check, server mode and data directory inspection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# `cargo binstall fusee-cli`: the binaries on the GitHub release (see
# .github/workflows/release.yml, github-release), named fusee-<platform>.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/fusee-{ target }"
pkg-fmt = "bin"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/fusee-linux-x64-musl"
[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/fusee-linux-x64-musl"
[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/fusee-linux-arm64-musl"
[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/fusee-linux-arm64-musl"
[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/fusee-darwin-arm64"
[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/fusee-darwin-x64"

[[bin]]
name = "fusee"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
# S3 backup targets: rustls, ring and sha2 are already in the binary (fusee-server).
fusee = { workspace = true, features = ["s3"] }
fusee-core.workspace = true
fusee-server.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal"] }

[lints]
workspace = true
