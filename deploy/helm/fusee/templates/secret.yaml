apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fusee.name" . }}-token
  labels: {{- include "fusee.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-token" (include "fusee.name" .)) }}
  {{- if .Values.token }}
  token: {{ .Values.token | quote }}
  {{- else if $existing }}
  token: {{ index $existing.data "token" | b64dec | quote }}
  {{- else }}
  token: {{ randAlphaNum 48 | quote }}
  {{- end }}
